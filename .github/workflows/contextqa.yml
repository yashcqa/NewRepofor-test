name: ContextQA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  contextqa:
    runs-on: ubuntu-latest
    steps:
      - uses: indivatools/contextqa-ci@v1
        with:
          plan-id: 22
          token: ${{ secrets.CONTEXTQA_TOKEN }}
          api-url: https://api.onprem-aws-01.contextqa.info
          wait: false
