name: ContextQA iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  contextqa-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS build
        run: curl -L -o app.ipa https://github.com/yashcqa/Mobile-Add/releases/download/v2/SauceLabs.ipa

      - uses: indivatools/contextqa-ci@v1
        with:
          plan-id: 280
          token: ${{ secrets.CONTEXTQA_TOKEN }}
          api-url: https://api.onprem-aws-01.contextqa.info
          ios-build: app.ipa
          wait: false
